name: Judge

on:
  workflow_dispatch:
    inputs:
      submission_id:
        required: true
      problem_id:
        required: true
      language:
        required: true
      code_b64:
        required: true

permissions:
  contents: write

jobs:
  judge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run judge
        env:
          SUBMISSION_ID: ${{ github.event.inputs.submission_id }}
          PROBLEM_ID: ${{ github.event.inputs.problem_id }}
          CODE_B64: ${{ github.event.inputs.code_b64 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python3 runner/orchestrator.py

      - name: Commit result
        run: |
          git config user.name "judge-bot"
          git config user.email "judge-bot@users.noreply.github.com"
          git add results/
          git commit -m "result: ${{ github.event.inputs.submission_id }}" || echo "nothing to commit"
          git push
